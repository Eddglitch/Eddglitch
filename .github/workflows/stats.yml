name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generar tarjeta de estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py assets/stats.svg

      - name: Publicar cambios si los hay
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "Sin cambios en las estadísticas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: actualizar estadísticas"
          git push
